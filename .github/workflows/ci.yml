name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check
      - name: Rust tests (receiver, hooks installer, storage, detection)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # Codex runs command hooks as `cmd.exe /C "<command>"`; the installed app is a GUI-subsystem
      # executable (no console), which only release-like builds are. Same test, built that way.
      - name: Codex hooks through cmd.exe with the GUI-subsystem executable
        if: runner.os == 'Windows'
        env:
          AGENTVILLE_EXPECT_GUI_EXE: '1'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test codex_forwarding --config profile.dev.debug-assertions=false --config profile.test.debug-assertions=false
      - name: Production web build
        run: npm run build

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/relay/package-lock.json
      - run: npm ci
      - name: Typecheck the Worker against the Cloudflare runtime types
        run: npm run typecheck
