name: Release

# Builds installers and attaches them to the GitHub release for a tag:
#   - push a tag like v0.2.0  → builds macOS (universal .dmg) and Windows (.exe)
#   - Actions → Release → Run workflow → pick a tag and platform to (re)build one
#
# Builds are currently UNSIGNED (no Apple Developer ID / Windows certificate yet).
# To sign macOS builds later, add the APPLE_* repository secrets listed in
# docs/RELEASE.md and pass them as `env:` to the tauri-action step of the macos
# job. Don't add the env entries before the secrets exist: empty values make the
# bundler try to import an empty certificate and the build fails.
#
# In-app updates: every build is signed with the updater key
# (TAURI_SIGNING_PRIVATE_KEY / _PASSWORD secrets, unrelated to Apple/Windows code
# signing) and the release gets a latest.json that installed apps read on launch.
# Apps only see a release once it's published.
#
# The tag is all a release needs (scripts/release-prep.mjs): the app version is
# set from it, and the notes come from docs/release-notes/<tag>.md on the
# workflow's branch (so they can be added after tagging: write them on main, then
# Run workflow with the tag), else the tag's own copy, else the commit list.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build for (e.g. v0.1.0)
        required: true
      platform:
        description: Which installers to build
        type: choice
        options: [all, macos, windows]
        default: all

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # File names without the version (Agentville_universal.dmg, Agentville_x64-setup.exe), via
  # tauri-action@v0's `assetNamePattern` (newer releases of the action call it releaseAssetNamePattern), so
  # …/releases/latest/download/<name> always points at the newest build. The version inside
  # the app, which upgrades compare, is set from the tag.
  ASSET_NAMES: '[name]_[arch][setup][ext]'

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0 # the commits since the previous release, for notes nobody wrote
      # The release script and notes from the workflow's own commit (main, for Run workflow).
      - uses: actions/checkout@v4
        with:
          path: .release
          sparse-checkout: |
            scripts
            docs/release-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Version and notes from the tag
        id: notes
        shell: bash
        run: node .release/scripts/release-prep.mjs "$RELEASE_TAG" "$RUNNER_TEMP/notes.md" .release/docs/release-notes docs/release-notes
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Agentville ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          assetNamePattern: ${{ env.ASSET_NAMES }}
          args: --target universal-apple-darwin --bundles app,dmg
      # The same notes as the release text, also when the release already existed (say, made by hand on GitHub).
      - name: Release text
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Agentville $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"

  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0 # the commits since the previous release, for notes nobody wrote
      # The release script and notes from the workflow's own commit (main, for Run workflow).
      - uses: actions/checkout@v4
        with:
          path: .release
          sparse-checkout: |
            scripts
            docs/release-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Version and notes from the tag
        id: notes
        shell: bash
        run: node .release/scripts/release-prep.mjs "$RELEASE_TAG" "$RUNNER_TEMP/notes.md" .release/docs/release-notes docs/release-notes
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Agentville ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          assetNamePattern: ${{ env.ASSET_NAMES }}
          args: --bundles nsis
      # The same notes as the release text, also when the release already existed (say, made by hand on GitHub).
      - name: Release text
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Agentville $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
